      <rect x="0" y="0" width="300" height="200" fill="#F7F4EC"/>
      <line x1="20" y1="0" x2="20" y2="200" stroke="#9CC3DA" stroke-width="1"/>
      <line x1="40" y1="0" x2="40" y2="200" stroke="#9CC3DA" stroke-width="1"/>
      <line x1="60" y1="0" x2="60" y2="200" stroke="#9CC3DA" stroke-width="1"/>
      <line x1="80" y1="0" x2="80" y2="200" stroke="#9CC3DA" stroke-width="1"/>
      <line x1="100" y1="0" x2="100" y2="200" stroke="#9CC3DA" stroke-width="1"/>
      <line x1="120" y1="0" x2="120" y2="200" stroke="#9CC3DA" stroke-width="1"/>
      <line x1="140" y1="0" x2="140" y2="200" stroke="#9CC3DA" stroke-width="1"/>
      <line x1="160" y1="0" x2="160" y2="200" stroke="#9CC3DA" stroke-width="1"/>
