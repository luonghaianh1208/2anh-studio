      <line x1="240" y1="0" x2="240" y2="200" stroke="#9CC3DA" stroke-width="1"/>
      <line x1="260" y1="0" x2="260" y2="200" stroke="#9CC3DA" stroke-width="1"/>
      <line x1="280" y1="0" x2="280" y2="200" stroke="#9CC3DA" stroke-width="1"/>
      <line x1="0" y1="20" x2="300" y2="20" stroke="#9CC3DA" stroke-width="1"/>
      <line x1="0" y1="40" x2="300" y2="40" stroke="#9CC3DA" stroke-width="1"/>
      <line x1="0" y1="60" x2="300" y2="60" stroke="#9CC3DA" stroke-width="1"/>
